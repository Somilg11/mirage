name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mirage
          POSTGRES_PASSWORD: mirage
          POSTGRES_DB: mirage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirage -d mirage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mirage:mirage@localhost:5432/mirage_test
      TEST_DATABASE_URL: postgresql://mirage:mirage@localhost:5432/mirage_test
      TEST_CONCURRENCY: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        run: bun run db:deploy

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
